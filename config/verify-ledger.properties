# scripts/verify-ledger.sh 전용: H2 메모리 DB 에 samples/ledger_scenario.sql 을 올려 원장 조회 시나리오를 재현한다.
source.file=samples/test-status-sample.xlsx
rawCounts.file=
output.dir=verify-output/ledger
output.fileNamePattern=카드이동서비스채널확대_테스트현황_{date}_{hour}시.xlsx
output.keepDays=0
state.dir=verify-output/ledger/state
log.dir=verify-output/ledger/logs
report.title=카드이동서비스 채널확대 통합테스트 현황
report.warnThreshold=60
mail.subject=[{title}] {datetime} 기준 - 전체 진척률 {progress}%
mail.enabled=false

ledger.enabled=true
ledger.jdbc.url=jdbc:h2:mem:ledger;MODE=Oracle;INIT=RUNSCRIPT FROM 'samples/ledger_scenario.sql'
ledger.jdbc.user=sa
ledger.rules.file=config/ledger_rules.csv
ledger.clearUnmatched=true
