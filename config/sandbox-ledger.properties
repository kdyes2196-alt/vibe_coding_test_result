# scripts/ledger-db.sh 전용: 프롬프트로 거래를 쌓아 가며 검증하는 파일 DB(sandbox/)
source.file=samples/test-status-sample.xlsx
rawCounts.file=
output.dir=sandbox/output
output.fileNamePattern=카드이동서비스채널확대_테스트현황_{date}_{hour}시.xlsx
output.keepDays=0
state.dir=sandbox/state
log.dir=sandbox/logs
report.title=카드이동서비스 채널확대 통합테스트 현황
report.warnThreshold=60
mail.subject=[{title}] {datetime} 기준 - 전체 진척률 {progress}%
mail.enabled=false

ledger.enabled=true
ledger.jdbc.url=jdbc:h2:file:./sandbox/ledger;MODE=Oracle
ledger.jdbc.user=sa
ledger.rules.file=config/ledger_rules.csv
ledger.clearUnmatched=true
