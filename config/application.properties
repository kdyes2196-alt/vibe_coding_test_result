# =====================================================================
#  통합테스트 현황 자동 메일 발송 설정 (UTF-8 로 저장하세요)
#  ※ 경로는 역슬래시(\) 대신 슬래시(/)로 적으세요.  예) C:/Users/...
# =====================================================================

# ---- 입력 ------------------------------------------------------------
# 테스트 담당자가 갱신하는 통합테스트 현황 엑셀 (원본은 수정하지 않음)
source.file=C:/Users/kdyes/OneDrive/바탕 화면/바이브코딩 챌린지/0_바이브코딩 로우데이터 _261021/3. 테스트현황 예시파일.xlsx

# (선택) 900N02/AC4111 건수 원천 CSV. 비워 두면 엑셀에 있는 값 그대로 사용
#   상세 시트의 VLOOKUP(#REF!) 참조를 이 데이터가 들어간 시트로 자동 연결합니다.
rawCounts.file=
rawCounts.sheetName=원천데이터

# ---- 출력 ------------------------------------------------------------
output.dir=output
output.fileNamePattern=카드이동서비스채널확대_테스트현황_{datetime}.xlsx
# 생성된 보고서 보관 일수 (0 이면 삭제 안 함)
output.keepDays=30
state.dir=state
log.dir=logs

# ---- 보고서 ----------------------------------------------------------
report.title=카드이동서비스 채널확대 통합테스트 현황
# 요약 시트 이름 (비워 두면 이름에 '(요약)'이 들어간 시트를 자동 선택)
report.summarySheet=
# 이 값 미만인 기관은 메일 본문에 붉은색 표시
report.warnThreshold=60

# ---- 메일 ------------------------------------------------------------
mail.enabled=true
mailingList.file=config/mailing_list.csv
# 사용 가능한 값: {title} {date} {datetime} {progress}
mail.subject=[{title}] {datetime} 기준 - 전체 진척률 {progress}%
mail.fromName=통합테스트 현황 알림
mail.from=kdyes2196@gmail.com
# 원본/원천 파일이 지난 발송 이후 바뀌지 않았으면 발송 생략
mail.skipIfUnchanged=false
# 실행 실패 시 오류 알림을 받을 주소 (비우면 알림 안 함)
mail.adminOnError=kdyes2196@gmail.com

# SMTP 서버
#  - Gmail      : smtp.gmail.com / 587 / STARTTLS  (구글 계정 > 보안 > 앱 비밀번호 사용)
#  - Office 365 : smtp.office365.com / 587 / STARTTLS
#  - 사내 SMTP  : 담당 부서에 호스트/포트/인증 여부 확인
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
# STARTTLS | SSL | NONE
mail.smtp.security=STARTTLS
mail.smtp.auth=true
mail.username=kdyes2196@gmail.com
# 비밀번호는 여기에 적지 말고 환경변수 MAIL_PASSWORD 로 지정하는 것을 권장
mail.password=

# ---- 상주 모드(--daemon) 실행 시각 -----------------------------------
# 작업 스케줄러를 쓰는 경우에는 무시됩니다.
schedule.times=09:00,18:00
schedule.weekdaysOnly=true
