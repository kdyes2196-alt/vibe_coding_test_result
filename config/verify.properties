# scripts/verify.sh 전용 설정: samples/ 의 예시 파일로 메일 없이(--dry-run) 보고서와 본문 미리보기를 만든다.
source.file=samples/test-status-sample.xlsx
rawCounts.file=samples/raw_counts_sample.csv
rawCounts.sheetName=원천데이터
output.dir=verify-output
output.fileNamePattern=카드이동서비스채널확대_테스트현황_{date}_{hour}시.xlsx
output.keepDays=0
state.dir=verify-output/state
log.dir=verify-output/logs
report.title=카드이동서비스 채널확대 통합테스트 현황
report.warnThreshold=60
mail.subject=[{title}] {datetime} 기준 - 전체 진척률 {progress}%
mail.enabled=false
